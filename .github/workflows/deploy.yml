name: Deploy to Vercel

# A deploy that does not depend on who authored the commit.
#
# Vercel resolves a commit's author email to a Vercel account and refuses the
# deployment if that account is not in the team owning the project — the Hobby
# plan cannot add members, so there is no way to grant access to a contributor.
#
# A token-based deploy is attributed to the token's owner rather than to the
# commit author, so the check does not apply. Whoever writes the commit, the
# deployment is made by the account that owns the project.

# This is the only deploy path for this project. Vercel's Git integration is
# disabled for `main` in vercel.json, because it refuses every commit regardless
# of author: kailash1005@gmail.com deployed fine on 5 Aug and was blocked on
# 10 Aug with an identical single-commit range, so the account it maps to is no
# longer in the team that owns the project. Author-side fixes cannot work.
on:
  push:
    branches: [main]
  # Re-run without an empty commit — needed after changing an environment
  # variable in Vercel, since NEXT_PUBLIC_* values are baked in at build time.
  workflow_dispatch:

# A newer push supersedes one still building. Never cancel a run mid-flight
# though: a half-finished deploy would leave production in an unknown state.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check required secrets are present
        # Without this the run dies inside the Vercel CLI with a generic auth
        # error. Fail here instead, naming exactly what is missing.
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing VERCEL_TOKEN"
          [ -n "$ORG" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$PROJECT" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production project settings and environment
        # This is what makes NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY reach the build:
        # it downloads the project's Production environment variables so the
        # build below inlines them, exactly as a Vercel-side build would.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        # --prebuilt uploads the artifacts built in the step above rather than
        # rebuilding on Vercel, so what was verified here is what goes live.
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
